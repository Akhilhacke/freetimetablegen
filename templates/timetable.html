<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timetable — FreeTimetableGen</title>
    <link rel="stylesheet" href="/static/css/app.css?v=2">
    <link rel="stylesheet" href="/static/css/fontawesome.min.css">
    
    <script src="/static/js/alpine.min.js" defer></script>
    
    <style>
        .cell-drop { transition: all 0.15s; }
        .cell-drop.drag-over { background: rgba(79,70,229,0.08); outline: 2px dashed #4F46E5; }
        .tt-cell { cursor: grab; user-select: none; }
        .tt-cell:active { cursor: grabbing; }
        .tt-cell.dragging { opacity: 0.4; }
        .period-label { writing-mode: vertical-rl; text-orientation: mixed; transform: rotate(180deg); }
    </style>
</head>
<body class="font-sans bg-surface-900 text-body min-h-screen" x-data="timetable()">
    <div class="max-w-full mx-auto px-4 sm:px-6 py-8">
        <!-- Header -->
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-4">
            <div>
                <a href="/dashboard" class="text-sm text-surface-400 hover:text-brand-400 mb-2 inline-block"><i class="fas fa-arrow-left mr-1"></i> Dashboard</a>
                <h1 class="text-2xl font-extrabold">Timetable</h1>
            </div>
            <div class="flex flex-wrap gap-3">
                <select x-model="selectedClass" @change="loadTimetable()" class="px-4 py-2 rounded-xl bg-surface-800 border border-surface-700 text-white text-sm focus:ring-2 focus:ring-brand-500">
                    <option value="">All Classes</option>
                    {% for c in classes %}
                    <option value="{{ c.id }}">{{ c.name }}</option>
                    {% endfor %}
                </select>
                <select x-model="selectedTeacher" @change="loadTimetable()" class="px-4 py-2 rounded-xl bg-surface-800 border border-surface-700 text-white text-sm focus:ring-2 focus:ring-brand-500">
                    <option value="">All Teachers</option>
                    {% for t in teachers %}
                    <option value="{{ t.id }}">{{ t.name }}</option>
                    {% endfor %}
                </select>
                {% if user.role == 'admin' %}
                <button @click="generateTimetable()" class="px-4 py-2 bg-brand-500 hover:bg-brand-400 rounded-xl text-sm font-semibold transition">
                    <i class="fas fa-magic mr-2"></i> Generate
                </button>
                {% endif %}
                <div class="relative" x-data="{open:false}">
                    <button @click="open=!open" class="px-4 py-2 bg-surface-800 hover:bg-surface-700 rounded-xl text-sm font-medium border border-surface-700 transition">
                        <i class="fas fa-download mr-2"></i> Export
                    </button>
                    <div x-show="open" @click.away="open=false" class="absolute right-0 mt-2 w-40 bg-surface-800 rounded-xl border border-surface-700 shadow-xl z-10">
                        <a :href="'/api/export/csv'+(selectedClass?'?class_id='+selectedClass:'')" class="block px-4 py-2.5 text-sm hover:bg-surface-700 rounded-t-xl transition"><i class="fas fa-file-csv mr-2 text-green-400"></i> CSV</a>
                        <a :href="'/api/export/excel'+(selectedClass?'?class_id='+selectedClass:'')" class="block px-4 py-2.5 text-sm hover:bg-surface-700 rounded-b-xl transition"><i class="fas fa-file-excel mr-2 text-blue-400"></i> Excel</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Conflict Alert -->
        <div x-show="conflicts>0" class="mb-4 p-3 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 text-sm flex items-center gap-2">
            <i class="fas fa-exclamation-triangle"></i>
            <span x-text="conflicts + ' conflict(s) detected in the timetable!'"></span>
        </div>

        <!-- Timetable Grid -->
        <div class="bg-surface-800 rounded-2xl border border-surface-700 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-sm min-w-[900px]">
                    <thead>
                        <tr class="border-b border-surface-700">
                            <th class="p-3 text-left text-surface-400 font-medium w-32">Period</th>
                            {% for day in ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'] %}
                            <th class="p-3 text-center text-surface-400 font-medium">{{ day }}</th>
                            {% endfor %}
                        </tr>
                    </thead>
                    <tbody>
                        <template x-for="p in periods" :key="p">
                            <tr class="border-b border-surface-700/50" :class="p===lunchPeriod?'bg-surface-700/30':''">
                                <td class="p-3">
                                    <div class="font-medium text-surface-300 text-xs">Period <span x-text="p+1"></span></div>
                                    <div class="text-[10px] text-surface-500" x-text="getPeriodTime(p)"></div>
                                </td>
                                {% for day_idx in range(6) %}
                                <td class="p-1.5 cell-drop" :data-day="{{ day_idx }}" :data-period="p"
                                    @dragover.prevent="$el.classList.add('drag-over')"
                                    @dragleave="$el.classList.remove('drag-over')"
                                    @drop.prevent="handleDrop($event, {{ day_idx }}, p); $el.classList.remove('drag-over')">
                                    <template x-if="p === lunchPeriod">
                                        <div class="text-center py-3 text-surface-500 text-xs font-medium rounded-lg bg-surface-700/50">
                                            <i class="fas fa-utensils mr-1"></i> Lunch
                                        </div>
                                    </template>
                                    <template x-if="p !== lunchPeriod">
                                        <div class="tt-cell rounded-lg p-2 min-h-[60px] transition"
                                             :class="getCellClass({{ day_idx }}, p)"
                                             :style="getCellStyle({{ day_idx }}, p)"
                                             draggable="true"
                                             @dragstart="handleDragStart($event, {{ day_idx }}, p)"
                                             @dragend="$el.classList.remove('dragging')">
                                            <template x-if="getCell({{ day_idx }}, p)">
                                                <div>
                                                    <div class="font-semibold text-xs leading-tight" x-text="getCell({{ day_idx }}, p).subject_name"></div>
                                                    <div class="text-[10px] opacity-70 mt-0.5" x-text="getCell({{ day_idx }}, p).teacher_name"></div>
                                                    <div class="text-[10px] opacity-50" x-text="getCell({{ day_idx }}, p).room_name || ''"></div>
                                                </div>
                                            </template>
                                            <template x-if="!getCell({{ day_idx }}, p)">
                                                <div class="text-surface-600 text-xs text-center py-4 opacity-0 hover:opacity-100 transition">
                                                    <i class="fas fa-plus"></i>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </td>
                                {% endfor %}
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Legend -->
        <div class="mt-4 flex flex-wrap gap-4 text-xs text-surface-400">
            <div class="flex items-center gap-2">
                <div class="w-3 h-3 rounded bg-brand-500/30 border border-brand-500/50"></div> Drag to swap
            </div>
            <div class="flex items-center gap-2">
                <i class="fas fa-utensils text-surface-500"></i> Lunch Break
            </div>
        </div>
    </div>

    <!-- Conflict Modal -->
    <div x-show="showConflictModal" x-transition class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
        <div class="bg-surface-800 rounded-2xl p-6 w-full max-w-sm border border-surface-700 text-center">
            <div class="w-16 h-16 rounded-full bg-red-500/20 flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-exclamation-triangle text-red-400 text-2xl"></i>
            </div>
            <h3 class="text-lg font-bold mb-2">Conflict Detected!</h3>
            <p class="text-surface-400 text-sm mb-4" x-text="conflictMessage"></p>
            <button @click="showConflictModal=false" class="px-6 py-2 bg-surface-700 hover:bg-surface-600 rounded-xl text-sm font-medium transition">OK</button>
        </div>
    </div>

    <script>
        const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
        
        function timetable() {
            return {
                entries: [], selectedClass: '{{ selected_class or "" }}', selectedTeacher: '{{ selected_teacher or "" }}',
                periods: Array.from({length:8}, (_,i) => i), lunchPeriod: 4, conflicts: 0,
                dragData: null, showConflictModal: false, conflictMessage: '',
                startTime: '08:00', periodDuration: 45, classTimeSlots: [],

                init() {
                    this.loadConfig();
                    this.loadTimetable();
                },
                async loadConfig() {
                    try {
                        const cfg = await (await fetch('/api/config')).json();
                        this.periods = Array.from({length: cfg.periods_per_day}, (_,i) => i);
                        this.lunchPeriod = cfg.lunch_period;
                        this.startTime = cfg.start_time;
                        this.periodDuration = cfg.period_duration;
                    } catch(e) {}
                },
                async loadTimeSlots() {
                    if (!this.selectedClass) {
                        this.classTimeSlots = [];
                        return;
                    }
                    try {
                        this.classTimeSlots = await (await fetch(`/api/classes/${this.selectedClass}/time-slots`)).json();
                        // Update periods to match available slots
                        if (this.classTimeSlots.length) {
                            this.periods = this.classTimeSlots.map(s => s.period_number);
                            this.lunchPeriod = (this.classTimeSlots.find(s => s.is_break) || {}).period_number ?? -1;
                        }
                    } catch(e) {
                        this.classTimeSlots = [];
                    }
                },
                async loadTimetable() {
                    let url = '/api/timetable?';
                    if (this.selectedClass) url += 'class_id=' + this.selectedClass + '&';
                    if (this.selectedTeacher) url += 'teacher_id=' + this.selectedTeacher;
                    this.entries = await (await fetch(url)).json();
                    await this.loadTimeSlots();
                    this.checkConflicts();
                },
                async checkConflicts() {
                    const res = await (await fetch('/api/timetable/conflicts')).json();
                    this.conflicts = res.count;
                },
                getCell(day, period) {
                    return this.entries.find(e => e.day_of_week === day && e.period_number === period);
                },
                getCellClass(day, period) {
                    const cell = this.getCell(day, period);
                    if (!cell) return 'bg-surface-700/30 hover:bg-surface-700/50';
                    return '';
                },
                getCellStyle(day, period) {
                    const cell = this.getCell(day, period);
                    if (!cell) return '';
                    const c = cell.subject_color || '#4F46E5';
                    const r = parseInt(c.slice(1,3), 16), g = parseInt(c.slice(3,5), 16), b = parseInt(c.slice(5,7), 16);
                    return `background:rgba(${r},${g},${b},0.15); border-left:4px solid ${c}; color:${c}; font-weight:600`;
                },
                getPeriodTime(p) {
                    // Use class-specific time slots if available
                    if (this.classTimeSlots.length) {
                        const slot = this.classTimeSlots.find(s => s.period_number === p);
                        if (slot) return `${slot.start_time} - ${slot.end_time}`;
                    }
                    // Fallback to calculated times
                    const [h, m] = this.startTime.split(':').map(Number);
                    const start = h * 60 + m + p * (this.periodDuration + 5);
                    const end = start + this.periodDuration;
                    return `${String(Math.floor(start/60)).padStart(2,'0')}:${String(start%60).padStart(2,'0')} - ${String(Math.floor(end/60)).padStart(2,'0')}:${String(end%60).padStart(2,'0')}`;
                },
                handleDragStart(e, day, period) {
                    this.dragData = { day, period };
                    e.target.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                },
                async handleDrop(e, toDay, toPeriod) {
                    if (!this.dragData) return;
                    if (this.dragData.day === toDay && this.dragData.period === toPeriod) return;

                    try {
                        const res = await fetch('/api/timetable/swap', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({
                                class_id: this.selectedClass || this.entries[0]?.class_id,
                                day1: this.dragData.day, period1: this.dragData.period,
                                day2: toDay, period2: toPeriod
                            })
                        });
                        const data = await res.json();
                        if (data.success) {
                            this.loadTimetable();
                        } else {
                            this.conflictMessage = data.message || 'Swap failed';
                            this.showConflictModal = true;
                        }
                    } catch (err) {
                        this.conflictMessage = err.message;
                        this.showConflictModal = true;
                    }
                    this.dragData = null;
                },
                async generateTimetable() {
                    if (!confirm('Generate a new timetable? This will replace the current one.')) return;
                    try {
                        const res = await fetch('/api/timetable/generate', { method: 'POST' });
                        const data = await res.json();
                        if (data.success) {
                            this.loadTimetable();
                        } else {
                            this.conflictMessage = (data.errors || ['Generation failed']).join(', ');
                            this.showConflictModal = true;
                        }
                    } catch (err) {
                        this.conflictMessage = err.message;
                        this.showConflictModal = true;
                    }
                },
            }
        }
    </script>
</body>
</html>
