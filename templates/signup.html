<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — FreeTimetableGen</title>
    <link rel="stylesheet" href="/static/css/app.css?v=2">
    <link rel="stylesheet" href="/static/css/fontawesome.min.css">
    
    
</head>
<body class="font-sans bg-surface-900 text-body min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <a href="/" class="inline-flex items-center gap-2 mb-6">
                <div class="w-10 h-10 rounded-xl bg-brand-500 flex items-center justify-center">
                    <i class="fas fa-calendar-alt text-white"></i>
                </div>
                <span class="text-xl font-bold">FreeTimetableGen</span>
            </a>
            <h1 class="text-2xl font-extrabold">Create Account</h1>
            <p class="text-surface-400 mt-2">Start generating timetables in minutes</p>
        </div>
        
        {% if error %}
        <div class="mb-4 p-3 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 text-sm flex items-center gap-2">
            <i class="fas fa-exclamation-circle"></i> {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/signup" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-surface-300 mb-1.5">Full Name</label>
                <input type="text" name="full_name" required
                    class="w-full px-4 py-3 rounded-xl bg-surface-800 border border-surface-700 text-white placeholder-surface-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition"
                    placeholder="Enter full name">
            </div>
            <div>
                <label class="block text-sm font-medium text-surface-300 mb-1.5">Username</label>
                <input type="text" name="username" required
                    class="w-full px-4 py-3 rounded-xl bg-surface-800 border border-surface-700 text-white placeholder-surface-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition"
                    placeholder="Choose a username">
            </div>
            <div>
                <label class="block text-sm font-medium text-surface-300 mb-1.5">Email</label>
                <input type="email" name="email" required
                    class="w-full px-4 py-3 rounded-xl bg-surface-800 border border-surface-700 text-white placeholder-surface-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition"
                    placeholder="Enter email address">
            </div>
            <div>
                <label class="block text-sm font-medium text-surface-300 mb-1.5">Password</label>
                <input type="password" name="password" required minlength="6"
                    class="w-full px-4 py-3 rounded-xl bg-surface-800 border border-surface-700 text-white placeholder-surface-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition"
                    placeholder="Min 6 characters">
            </div>
            <div>
                <label class="block text-sm font-medium text-surface-300 mb-1.5">I am a</label>
                <div class="grid grid-cols-3 gap-3">
                    <label class="relative cursor-pointer">
                        <input type="radio" name="role" value="admin" class="peer sr-only" checked>
                        <div class="p-3 rounded-xl border-2 border-surface-700 peer-checked:border-brand-500 peer-checked:bg-brand-500/10 transition text-center">
                            <i class="fas fa-user-cog text-lg mb-1 text-surface-400 peer-checked:text-brand-400"></i>
                            <div class="text-xs font-medium">Admin</div>
                        </div>
                    </label>
                    <label class="relative cursor-pointer">
                        <input type="radio" name="role" value="teacher" class="peer sr-only">
                        <div class="p-3 rounded-xl border-2 border-surface-700 peer-checked:border-brand-500 peer-checked:bg-brand-500/10 transition text-center">
                            <i class="fas fa-chalkboard-teacher text-lg mb-1 text-surface-400 peer-checked:text-brand-400"></i>
                            <div class="text-xs font-medium">Teacher</div>
                        </div>
                    </label>
                    <label class="relative cursor-pointer">
                        <input type="radio" name="role" value="student" class="peer sr-only">
                        <div class="p-3 rounded-xl border-2 border-surface-700 peer-checked:border-brand-500 peer-checked:bg-brand-500/10 transition text-center">
                            <i class="fas fa-user-graduate text-lg mb-1 text-surface-400 peer-checked:text-brand-400"></i>
                            <div class="text-xs font-medium">Student</div>
                        </div>
                    </label>
                </div>
            </div>
            <button type="submit"
                class="w-full py-3 bg-brand-500 hover:bg-brand-400 rounded-xl font-semibold transition shadow-lg shadow-brand-500/25 flex items-center justify-center gap-2">
                <i class="fas fa-user-plus"></i> Create Account
            </button>
        </form>
        
        <p class="mt-6 text-center text-surface-400 text-sm">
            Already have an account? <a href="/login" class="text-brand-400 hover:text-brand-300 font-medium">Sign in</a>
        </p>
    </div>
</body>
</html>
