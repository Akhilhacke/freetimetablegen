<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings — FreeTimetableGen</title>
    <link rel="stylesheet" href="/static/css/app.css?v=2">
    <link rel="stylesheet" href="/static/css/fontawesome.min.css">
    
    
</head>
<body class="font-sans bg-surface-900 text-body min-h-screen">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 py-8">
        <div class="mb-8">
            <a href="/dashboard" class="text-sm text-surface-400 hover:text-brand-400 mb-2 inline-block"><i class="fas fa-arrow-left mr-1"></i> Dashboard</a>
            <h1 class="text-2xl font-extrabold">Settings</h1>
            <p class="text-surface-400 mt-1">Configure your timetable generation parameters</p>
        </div>

        <form method="POST" action="/settings" class="space-y-6">
            <div class="bg-surface-800 rounded-2xl border border-surface-700 p-6">
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
                    <i class="fas fa-school text-brand-400"></i> School Information
                </h2>
                <div>
                    <label class="block text-sm font-medium text-surface-300 mb-1">School/Institution Name</label>
                    <input type="text" name="school_name" value="{{ config.school_name }}"
                        class="w-full px-4 py-2.5 rounded-xl bg-surface-700 border border-surface-600 text-white focus:ring-2 focus:ring-brand-500 text-sm">
                </div>
            </div>

            <div class="bg-surface-800 rounded-2xl border border-surface-700 p-6">
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
                    <i class="fas fa-clock text-blue-400"></i> Period Configuration
                </h2>
                <div class="grid sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-surface-300 mb-1">Periods per Day</label>
                        <input type="number" name="periods_per_day" value="{{ config.periods_per_day }}" min="4" max="12"
                            class="w-full px-4 py-2.5 rounded-xl bg-surface-700 border border-surface-600 text-white focus:ring-2 focus:ring-brand-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-surface-300 mb-1">Period Duration (minutes)</label>
                        <input type="number" name="period_duration" value="{{ config.period_duration }}" min="20" max="90"
                            class="w-full px-4 py-2.5 rounded-xl bg-surface-700 border border-surface-600 text-white focus:ring-2 focus:ring-brand-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-surface-300 mb-1">Day Start Time</label>
                        <input type="time" name="start_time" value="{{ config.start_time }}"
                            class="w-full px-4 py-2.5 rounded-xl bg-surface-700 border border-surface-600 text-white focus:ring-2 focus:ring-brand-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-surface-300 mb-1">Lunch Break After Period</label>
                        <input type="number" name="lunch_period" value="{{ config.lunch_period }}" min="0" max="11"
                            class="w-full px-4 py-2.5 rounded-xl bg-surface-700 border border-surface-600 text-white focus:ring-2 focus:ring-brand-500 text-sm">
                        <p class="text-xs text-surface-500 mt-1">Set to -1 to disable lunch break slot</p>
                    </div>
                </div>
            </div>

            <div class="bg-surface-800 rounded-2xl border border-surface-700 p-6">
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
                    <i class="fas fa-calendar text-purple-400"></i> Working Days
                </h2>
                <div class="flex flex-wrap gap-3">
                    {% for day_name in ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'] %}
                    <label class="relative cursor-pointer">
                        <input type="checkbox" name="working_days_values" value="{{ loop.index0 }}" 
                            {{ 'checked' if loop.index0|string in config.working_days.split(',') else '' }}
                            class="peer sr-only" onchange="updateWorkingDays()">
                        <div class="px-4 py-2 rounded-xl border-2 border-surface-600 peer-checked:border-brand-500 peer-checked:bg-brand-500/10 text-sm font-medium transition">
                            {{ day_name[:3] }}
                        </div>
                    </label>
                    {% endfor %}
                </div>
                <input type="hidden" name="working_days" id="working_days_input" value="{{ config.working_days }}">
            </div>

            <button type="submit" class="w-full py-3 bg-brand-500 hover:bg-brand-400 rounded-xl font-semibold transition shadow-lg shadow-brand-500/25">
                <i class="fas fa-save mr-2"></i> Save Settings
            </button>
        </form>
    </div>

    <script>
        function updateWorkingDays() {
            const checked = document.querySelectorAll('input[name="working_days_values"]:checked');
            const values = Array.from(checked).map(c => c.value).join(',');
            document.getElementById('working_days_input').value = values || '0,1,2,3,4,5';
        }
    </script>
</body>
</html>
