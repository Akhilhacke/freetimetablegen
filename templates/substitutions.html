<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Substitutions — FreeTimetableGen</title>
    <link rel="stylesheet" href="/static/css/app.css?v=2">
    <link rel="stylesheet" href="/static/css/fontawesome.min.css">
    
    <script src="/static/js/alpine.min.js" defer></script>
    
</head>
<body class="font-sans bg-surface-900 text-body min-h-screen" x-data="subs()">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
        <div class="flex items-center justify-between mb-8">
            <div>
                <a href="/dashboard" class="text-sm text-surface-400 hover:text-brand-400 mb-2 inline-block"><i class="fas fa-arrow-left mr-1"></i> Dashboard</a>
                <h1 class="text-2xl font-extrabold">Substitution Manager</h1>
                <p class="text-surface-400 mt-1">Find substitute teachers for absences</p>
            </div>
            <button @click="showModal=true;resetForm()" class="px-4 py-2 bg-brand-500 hover:bg-brand-400 rounded-xl text-sm font-semibold transition">
                <i class="fas fa-plus mr-2"></i> Add Substitution
            </button>
        </div>

        <!-- Substitution List -->
        <div class="bg-surface-800 rounded-2xl border border-surface-700 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="border-b border-surface-700 text-surface-400">
                            <th class="p-4 text-left font-medium">Date</th>
                            <th class="p-4 text-left font-medium">Day</th>
                            <th class="p-4 text-left font-medium">Period</th>
                            <th class="p-4 text-left font-medium">Class</th>
                            <th class="p-4 text-left font-medium">Subject</th>
                            <th class="p-4 text-left font-medium">Original Teacher</th>
                            <th class="p-4 text-left font-medium">Substitute</th>
                            <th class="p-4 text-left font-medium">Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-for="s in subsList" :key="s.id">
                            <tr class="border-b border-surface-700/50 hover:bg-surface-700/30 transition">
                                <td class="p-4" x-text="s.date || '-'"></td>
                                <td class="p-4" x-text="days[s.day_of_week]"></td>
                                <td class="p-4" x-text="'Period ' + (s.period_number+1)"></td>
                                <td class="p-4 font-medium" x-text="s.class_name"></td>
                                <td class="p-4" x-text="s.subject_name"></td>
                                <td class="p-4" x-text="s.original_teacher"></td>
                                <td class="p-4">
                                    <span x-show="s.substitute_teacher" class="text-brand-400 font-medium" x-text="s.substitute_teacher"></span>
                                    <span x-show="!s.substitute_teacher" class="text-surface-500">Not found</span>
                                </td>
                                <td class="p-4">
                                    <span class="px-2 py-0.5 rounded text-xs" 
                                          :class="s.status==='approved'?'bg-green-500/20 text-green-400':s.status==='rejected'?'bg-red-500/20 text-red-400':'bg-yellow-500/20 text-yellow-400'"
                                          x-text="s.status"></span>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
            <div x-show="subsList.length===0" class="p-12 text-center text-surface-500">
                <i class="fas fa-exchange-alt text-4xl mb-3"></i>
                <p>No substitutions recorded yet.</p>
            </div>
        </div>

        <!-- Modal -->
        <div x-show="showModal" x-transition class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
            <div @click.away="showModal=false" class="bg-surface-800 rounded-2xl p-6 w-full max-w-md border border-surface-700">
                <h3 class="text-lg font-bold mb-4">Find Substitute</h3>
                <form @submit.prevent="findSubstitute()" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-surface-300 mb-1">Absent Teacher *</label>
                        <select x-model="form.teacher_id" required class="w-full px-4 py-2.5 rounded-xl bg-surface-700 border border-surface-600 text-white text-sm focus:ring-2 focus:ring-brand-500">
                            <option value="">Select teacher...</option>
                            {% for t in teachers %}
                            <option value="{{ t.id }}">{{ t.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-surface-300 mb-1">Day *</label>
                            <select x-model="form.day" required class="w-full px-4 py-2.5 rounded-xl bg-surface-700 border border-surface-600 text-white text-sm focus:ring-2 focus:ring-brand-500">
                                {% for d in ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'] %}
                                <option value="{{ loop.index0 }}">{{ d }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-surface-300 mb-1">Period *</label>
                            <select x-model="form.period" required class="w-full px-4 py-2.5 rounded-xl bg-surface-700 border border-surface-600 text-white text-sm focus:ring-2 focus:ring-brand-500">
                                {% for p in range(8) %}
                                <option value="{{ p }}">Period {{ p+1 }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-surface-300 mb-1">Date</label>
                        <input type="date" x-model="form.date" class="w-full px-4 py-2.5 rounded-xl bg-surface-700 border border-surface-600 text-white text-sm focus:ring-2 focus:ring-brand-500">
                    </div>
                    <div class="flex gap-3 pt-2">
                        <button type="button" @click="showModal=false" class="flex-1 py-2.5 bg-surface-700 hover:bg-surface-600 rounded-xl text-sm font-medium transition">Cancel</button>
                        <button type="submit" class="flex-1 py-2.5 bg-brand-500 hover:bg-brand-400 rounded-xl text-sm font-semibold transition">
                            <i class="fas fa-search mr-2"></i> Find Substitute
                        </button>
                    </div>
                </form>
                <div x-show="result" class="mt-4 p-3 rounded-xl text-sm" :class="result?.success?'bg-green-500/10 text-green-400':'bg-red-500/10 text-red-400'">
                    <span x-text="result?.message || ('Substitute found: ' + (result?.substitute || ''))"></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
        function subs() {
            return {
                subsList: [], showModal: false, result: null, days: DAYS,
                form: { teacher_id:'', day:'0', period:'0', date:'' },
                init() { this.load(); },
                async load() { this.subsList = await (await fetch('/api/substitutions')).json(); },
                resetForm() { this.form={teacher_id:'',day:'0',period:'0',date:''}; this.result=null; },
                async findSubstitute() {
                    const timetable = await (await fetch('/api/timetable?teacher_id='+this.form.teacher_id)).json();
                    const entry = timetable.find(e => e.day_of_week==this.form.day && e.period_number==this.form.period);
                    if (!entry) { this.result={success:false,message:'No class found for this teacher at this time'}; return; }
                    
                    const res = await fetch('/api/substitution', {
                        method:'POST', headers:{'Content-Type':'application/json'},
                        body: JSON.stringify({
                            teacher_id: parseInt(this.form.teacher_id),
                            class_id: entry.class_id, subject_id: entry.subject_id,
                            day: parseInt(this.form.day), period: parseInt(this.form.period),
                            date: this.form.date
                        })
                    });
                    this.result = await res.json();
                    if (this.result.success) this.load();
                }
            }
        }
    </script>
</body>
</html>
