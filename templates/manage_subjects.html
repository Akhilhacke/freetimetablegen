<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Subjects — FreeTimetableGen</title>
    <link rel="stylesheet" href="/static/css/app.css?v=2">
    <link rel="stylesheet" href="/static/css/fontawesome.min.css">
    
    <script src="/static/js/alpine.min.js" defer></script>
    
</head>
<body class="font-sans bg-surface-900 text-body min-h-screen" x-data="subjects()">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
        <div class="flex items-center justify-between mb-8">
            <div>
                <a href="/dashboard" class="text-sm text-surface-400 hover:text-brand-400 mb-2 inline-block"><i class="fas fa-arrow-left mr-1"></i> Dashboard</a>
                <h1 class="text-2xl font-extrabold">Manage Subjects</h1>
            </div>
            <div class="flex gap-3">
                <label class="px-4 py-2 bg-surface-800 hover:bg-surface-700 rounded-xl text-sm font-medium cursor-pointer transition border border-surface-700">
                    <i class="fas fa-upload mr-2"></i> Import CSV
                    <input type="file" accept=".csv" class="hidden" onchange="importSubjects(this)">
                </label>
                <button @click="showModal=true;resetForm()" class="px-4 py-2 bg-brand-500 hover:bg-brand-400 rounded-xl text-sm font-semibold transition">
                    <i class="fas fa-plus mr-2"></i> Add Subject
                </button>
            </div>
        </div>

        <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
            <template x-for="s in subjectsList" :key="s.id">
                <div class="bg-surface-800 rounded-2xl border border-surface-700 p-5 hover:border-surface-600 transition">
                    <div class="flex items-start justify-between mb-3">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl flex items-center justify-center" :style="`background:${s.color}20`">
                                <i class="fas fa-book" :style="`color:${s.color}`"></i>
                            </div>
                            <div>
                                <h3 class="font-bold" x-text="s.name"></h3>
                                <p class="text-xs text-surface-400" x-text="s.code"></p>
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <button @click="editSubject(s)" class="text-surface-400 hover:text-brand-400 transition"><i class="fas fa-edit text-sm"></i></button>
                            <button @click="deleteSubject(s.id)" class="text-surface-400 hover:text-red-400 transition"><i class="fas fa-trash text-sm"></i></button>
                        </div>
                    </div>
                    <div class="flex items-center gap-4 text-xs text-surface-400">
                        <span><i class="fas fa-clock mr-1"></i> <span x-text="s.periods_per_week"></span> periods/week</span>
                        <span x-show="s.needs_lab"><i class="fas fa-flask mr-1 text-orange-400"></i> Lab Required</span>
                    </div>
                </div>
            </template>
        </div>
        <div x-show="subjectsList.length===0" class="bg-surface-800 rounded-2xl border border-surface-700 p-12 text-center text-surface-500">
            <i class="fas fa-book text-4xl mb-3"></i>
            <p>No subjects yet. Add your first subject!</p>
        </div>

        <!-- Modal -->
        <div x-show="showModal" x-transition class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
            <div @click.away="showModal=false" class="bg-surface-800 rounded-2xl p-6 w-full max-w-md border border-surface-700">
                <h3 class="text-lg font-bold mb-4" x-text="editingId ? 'Edit Subject' : 'Add Subject'"></h3>
                <form @submit.prevent="saveSubject()" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-surface-300 mb-1">Name *</label>
                        <input type="text" x-model="form.name" required class="w-full px-4 py-2.5 rounded-xl bg-surface-700 border border-surface-600 text-white focus:ring-2 focus:ring-brand-500 text-sm">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-surface-300 mb-1">Code *</label>
                            <input type="text" x-model="form.code" required class="w-full px-4 py-2.5 rounded-xl bg-surface-700 border border-surface-600 text-white focus:ring-2 focus:ring-brand-500 text-sm" placeholder="e.g. PHY101">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-surface-300 mb-1">Periods/Week</label>
                            <input type="number" x-model="form.periods_per_week" min="1" max="10" class="w-full px-4 py-2.5 rounded-xl bg-surface-700 border border-surface-600 text-white focus:ring-2 focus:ring-brand-500 text-sm">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-surface-300 mb-1">Color</label>
                        <div class="flex gap-2 flex-wrap">
                            <template x-for="c in ['#3b82f6','#10b981','#8b5cf6','#f59e0b','#ef4444','#ec4899','#06b6d4','#84cc16']" :key="c">
                                <button type="button" @click="form.color=c" class="w-8 h-8 rounded-lg transition" :class="form.color===c?'ring-2 ring-white scale-110':''" :style="`background:${c}`"></button>
                            </template>
                        </div>
                    </div>
                    <label class="flex items-center gap-3 p-3 bg-surface-700 rounded-xl cursor-pointer">
                        <input type="checkbox" x-model="form.needs_lab" class="rounded border-surface-500 text-brand-500 focus:ring-brand-500">
                        <span class="text-sm">Requires Lab/Equipment</span>
                    </label>
                    <div class="flex gap-3 pt-2">
                        <button type="button" @click="showModal=false" class="flex-1 py-2.5 bg-surface-700 hover:bg-surface-600 rounded-xl text-sm font-medium transition">Cancel</button>
                        <button type="submit" class="flex-1 py-2.5 bg-brand-500 hover:bg-brand-400 rounded-xl text-sm font-semibold transition">
                            <span x-text="editingId ? 'Update' : 'Create'"></span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        function subjects() {
            return {
                subjectsList: [], showModal: false, editingId: null,
                form: { name:'', code:'', color:'#3b82f6', periods_per_week:5, needs_lab:false },
                init() { this.load(); },
                async load() { this.subjectsList = await (await fetch('/api/subjects')).json(); },
                resetForm() { this.editingId=null; this.form={name:'',code:'',color:'#3b82f6',periods_per_week:5,needs_lab:false}; },
                editSubject(s) { this.editingId=s.id; this.form={name:s.name,code:s.code,color:s.color,periods_per_week:s.periods_per_week,needs_lab:!!s.needs_lab}; this.showModal=true; },
                async saveSubject() {
                    const fd = new FormData();
                    Object.keys(this.form).forEach(k => fd.append(k, this.form[k]));
                    await fetch(this.editingId?`/api/subjects/${this.editingId}`:'/api/subjects', { method:this.editingId?'PUT':'POST', body:fd });
                    this.showModal=false; this.load();
                },
                async deleteSubject(id) { if(!confirm('Delete?'))return; await fetch(`/api/subjects/${id}`,{method:'DELETE'}); this.load(); }
            }
        }
        async function importSubjects(input) {
            const file = input.files[0]; if(!file) return;
            const fd = new FormData(); fd.append('file', file);
            const data = await (await fetch('/api/import/subjects',{method:'POST',body:fd})).json();
            alert(`Imported ${data.imported} subjects`); location.reload();
        }
    </script>
</body>
</html>
